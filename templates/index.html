<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance - Welcome</title>
    <!-- استدعاء خطوط Google Fonts لخط عصري وجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات الصفحة والخلفية البنفسجية الفاتحة */
        body {
            background: linear-gradient(135deg, #f3e8ff 0%, #d8b4fe 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

        /* تصميم الصندوق الأبيض في الوسط */
        .welcome-card {
            background: white;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(107, 33, 168, 0.1);
            text-align: center;
            max-width: 550px;
            width: 90%;
        }

        /* تصميم العنوان الرئيسي */
        .welcome-title {
            color: #581c87; /* بنفسجي غامق للتباين */
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        /* تصميم النص الفرعي */
        .welcome-text {
            color: #6b7280;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* تصميم الزر (البطون) البنفسجي */
        .btn-start {
            display: inline-block;
            background-color: #9333ea;
            color: white;
            padding: 16px 45px;
            font-size: 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
        }

        /* تأثيرات عند تمرير الفأرة على الزر */
        .btn-start:hover {
            background-color: #7e22ce;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(147, 51, 234, 0.4);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1 class="welcome-title">Student Exam Performance</h1>
        <p class="welcome-text">
            Welcome to the AI-powered indicator. Predict student math scores accurately using advanced machine learning models.
        </p>
        
        <!-- هذا هو الزر اللي يديك لصفحة home.html -->
        <a href="/predictdata" class="btn-start">Let's Predict 🚀</a>
    </div>

</body>
</html>
